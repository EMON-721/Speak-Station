name: Verify Speak Station
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  # The newest commit supersedes verification on the same branch.
  # This prevents noisy failure alerts from obsolete, overlapping runs.
  group: verify-speaking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Speaking-book and part-level assessment tests
        run: node scripts/tests/verify-speaking-parts.mjs
      - name: Preserve core learner-facing features
        run: node scripts/tests/verify-features.mjs
      - name: Test 6-hour practice and seven-day test admission boundaries
        run: node scripts/tests/verify-session-policy.mjs
      - name: Check real 240-book content and all 45 scheduled exams
        run: node scripts/tests/verify-real-content.mjs
      - name: Verify all D1 migrations and progress storage
        run: python3 scripts/tests/verify-d1-migrations.py
      - name: Google OAuth and protected identity security tests
        run: node scripts/tests/verify-google-oauth.mjs
      - name: AI assessment integration simulations for Parts 1, 2 and 3
        run: node scripts/tests/verify-ai-assessment.mjs
      - name: Cloudflare production build (no secrets)
        run: pnpm run build:cloudflare

      - name: Public production smoke check (external, non-blocking)
        id: live_smoke
        continue-on-error: true
        env:
          SPEAK_PUBLIC_URL: https://speak-station.emon721.workers.dev
        run: node scripts/tests/live-public-smoke.mjs
      - name: Summarize production verification limitations
        if: always()
        run: |
          echo "### Verification scope" >> "$GITHUB_STEP_SUMMARY"
          echo "Pure logic, real question bank, OAuth security and migration tests execute in this job." >> "$GITHUB_STEP_SUMMARY"
          echo "Live smoke verifies public endpoints only. Authenticated Google sign-in completion, live microphone, actual AI provider, admin access and mobile layouts still need independent end-to-end browser testing." >> "$GITHUB_STEP_SUMMARY"

  browser_qa:
    name: Desktop and mobile browser QA
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install project
        run: pnpm install --frozen-lockfile
      - name: Cache browser binaries between QA runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu2404-playwright-1.58.2
      - name: Install isolated Playwright Chromium
        run: |
          npm install --prefix /tmp/speak-playwright --no-save --package-lock=false playwright@1.58.2
          /tmp/speak-playwright/node_modules/.bin/playwright install chromium --with-deps
      - name: Start local test server
        run: |
          (pnpm run dev > /tmp/speak-dev.log 2>&1 & echo $! > /tmp/speak-dev.pid)
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:5173/; then exit 0; fi
            sleep 2
          done
          cat /tmp/speak-dev.log
          exit 1
      - name: Verify desktop/mobile layout, profile, progress and speaking UI
        env:
          BROWSER_QA_ORIGIN: http://127.0.0.1:5173
        run: node scripts/tests/browser-e2e.mjs
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speak-station-browser-qa
          path: artifacts/browser-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Server troubleshooting logs
        if: failure()
        run: tail -n 140 /tmp/speak-dev.log || true
