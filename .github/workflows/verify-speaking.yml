name: Verify Speak Station
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Speaking-book and part-level assessment tests
        run: node scripts/tests/verify-speaking-parts.mjs
      - name: Cloudflare production build (no secrets)
        run: pnpm run build:cloudflare
